# Release: Changesets opens (and keeps up to date) a "Version Packages" pull request from the pending
# `.changeset/*.md` files; merging it publishes the changed packages to npm with provenance.
# How it works, the secret and a dry run: docs/releasing.md.

name: Release

on:
  push:
    branches: [main]

# A cancelled publish can leave only part of a release on npm.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Default-deny at the workflow level; the job asks for what it needs.
permissions: {}

jobs:
  release:
    name: Version Packages or publish
    # Forks never release.
    if: github.repository == 'zawoj/emdash-commerce'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the version commit, tags and GitHub releases
      pull-requests: write # open and update the "Version Packages" pull request
      id-token: write # npm provenance (a signed statement of which workflow built the tarball)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Version comes from package.json `packageManager`.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The packages ship source, so "build" is the type check; nothing is published from a red tree.
      - name: Validate
        run: |
          pnpm check:ai
          pnpm typecheck
          pnpm test
          pnpm build

      # No pending changeset: publishes every package whose version is not on npm yet.
      # Pending changesets: opens or updates the "Version Packages" pull request instead.
      - name: Version Packages pull request or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          # Repository secret: an npm automation token that can publish under the @emdash-commerce scope.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
